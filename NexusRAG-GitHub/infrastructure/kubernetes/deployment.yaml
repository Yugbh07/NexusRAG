apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusrag-deployment
  namespace: default
  labels:
    app: nexusrag
    tier: frontend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusrag
  template:
    metadata:
      labels:
        app: nexusrag
    spec:
      containers:
      - name: nexusrag-container
        image: gcr.io/YOUR_PROJECT_ID/nexusrag:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: http
        envFrom:
        - configMapRef:
            name: nexusrag-config
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: nexusrag-secrets
              key: GEMINI_API_KEY
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        # Readiness Probe: ensures container does not receive traffic until model is loaded
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Liveness Probe: restarts unhealthy container if application deadlocks
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
